# Release configuration. The workflow restricts releasing to master; this file
# decides what gets released once there.
#
# https://release-plz.dev/docs/config

[workspace]
# cargo-semver-checks before each release: a "patch" bump on a breaking API
# change is rejected and the version escalated to satisfy semver.
semver_check = true

# Only one crate here publishes — `xtask` is `publish = false` — so a plain
# `vX.Y.Z` tag is unambiguous.
git_tag_name = "v{{ version }}"

git_release_enable = true

# "auto" marks a version carrying a pre-release suffix as a GitHub pre-release,
# so a beta does not present itself as the latest stable download.
git_release_type = "auto"

# Publish whenever master carries a version that is not on crates.io, rather
# than only from a commit belonging to a merged Release PR.
#
# `false` cannot bootstrap a crate with nothing published: with no baseline,
# release-plz treats the manifest version as the next version and opens no
# Release PR, while the release job refuses any commit that is not from one.
#
# The publish gate is therefore CI alone — `release-plz-release` requires both
# `devenv-checks` and `msrv` to have succeeded on the exact tree being
# published — rather than a separate approval of the release itself.
release_always = true

# A release is triggered by changes to packaged files. README.md, LICENSE and
# src/ ship inside the crate, so editing any of them needs a new version before
# crates.io shows it.
#
# .github/, devenv.*, nix/ and statix.toml are NOT packaged, because Cargo.toml
# carries an explicit `exclude`; without it cargo ships everything not
# gitignored. xtask/ is a nested package, which cargo never packages either way.
#
# Check what ships with `cargo package --list`.

# Filterable in the GitHub UI as `is:pr label:release`, and excludable from
# "needs human review" queries with `-label:automated`.
pr_labels = ["release", "automated"]

[changelog]
header = """# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""

# Release commits are not changes. Parsed in, each one back-fills a changelog
# entry and opens another release PR, which produces another release commit.
#
# The optional-scope group catches both forms release-plz emits: the unscoped
# aggregate `chore: release` and the per-package `chore(<package>): release v<x>`.
commit_parsers = [
  { message = "^chore(\\(.+\\))?: release", skip = true },
]
